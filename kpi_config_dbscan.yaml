# Calculation methods for statistics
calculation_methods:
  mean:
    formula: "sum(bin_center[i] * count[i]) / sum(count[i])"
    description: "Distribution mean using bin centers"
    
  std:
    formula: "sqrt(sum(count[i] * (bin_center[i] - mean)^2) / sum(count[i]))"
    description: "Standard deviation from weighted distribution"
    
  median:
    method: "bin_threshold"
    description: "Find bin containing 50th percentile"
    
  percentile:
    method: "bin_threshold"
    description: "Find bin containing Nth percentile"
    
  sum:
    method: "sum"
    description: "Sum all values in the distribution"

